[versions]
# These versions are deliberately a CONSISTENT SET, not the newest of each.
# Rationale: an older-but-real version always resolves from Maven, while a
# guessed-too-new one fails the build outright. The sandbox that generated
# this scaffold cannot reach Google's Maven or Maven Central, so anything
# unverifiable was left at a known-consistent value.
#
# Verified against docs (Aug 2026):
#   - agp 8.9.1 is the MINIMUM AGP that supports compileSdk 36, which
#     Google Play now requires (see app/build.gradle.kts). 8.13 is the
#     newest 8.x if you want to go further.
#   - Chaquopy 17.0 supports AGP 7.3-9.2, so this is in range. Do NOT jump
#     to AGP 9.3+ without checking Chaquopy first.
#   - AGP 9.x is a breaking change (Kotlin plugin becomes built-in,
#     `kotlinOptions` is replaced); this project's build files use AGP 8 DSL.
#
# When you first sync, let Android Studio's AGP Upgrade Assistant modernize
# Kotlin/KSP/Compose together — it resolves that triple against live repos,
# which is more reliable than pinning them by hand. KSP must always match
# the Kotlin version exactly.
agp = "8.9.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
chaquopy = "17.0.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.4"
room = "2.6.1"
serialization = "1.7.3"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version = "2.10.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
